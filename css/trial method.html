<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-sizing: border-box;
        }
        body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(to right,#4f7de8,#5cc0e8);
}
        .calculator{
            background: #f2f2f2;
            padding: 30px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
            border-radius: 20px;
            width:260px;
        }
            .display{
                width:100%;
                height:50px;
                border:none;
                border-radius:10px;
                margin-bottom:20px;
                padding:10px;
                font-size:20px;
                background:#e5e5e5;
        }
        .buttons{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:12px;
        }
        button{
height:50px;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}
.number{
background:#b8c9e0;
}
.operator{
background:#f4c75a;
}
.clear{
background:#e6573f;
color:white;
}
.equal{
grid-column:span 2;
background:#47c78a;
color:white;
font-size:20px;
}


    </style>
</head>
<body>
    <div class="container">
        <div class="calculator">
            <input type="text" class="display" placeholder=" ">
            <div class="buttons">
                <button class="operator">+</button>
                <button class="operator">-</button>
                <button class="operator">*</button>
                <button class="operator">/</button>

                <button class="number">7</button>
                <button class="number">8</button>
                <button class="number">9</button>
                <button class="number">4</button>

                <button class="number">5</button>
                <button class="number">6</button>
                <button class="number">1</button>
                <button class="number">2</button>

                <button class="number">3</button>
                <button class="number">0</button>
                <button class="number">.</button>
                <button class="clear">C</button>
                
                <button class="equal">=</button>

            </div>

        </div>

    </div>
</body>
</html>
