<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>
</head>
<body>
    <button onclick="Addition()">Addition</button><br>
    <button onclick="Substraction()">SUBSTRACTION</button>

    <SCRipt>
        function Addition()
        {
            let a = Number(prompt("Enter A :"))
            let b = Number(prompt("Enter B :"))
            console.log(a+b)
        }

        function Substraction()
        {
            let x = Number(prompt("Enter X :"))
            let y = Number(prompt("Enter Y :"))
            console.log(x+y)
        }
    </SCRipt>
</body>
</html>
