<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>arithmatic operators</h1>
    <script>
        //addition operation
        var a = 15
        var b = 45
        console.log(a+b);

        // subtarction operation
        var c = 45
        var d = 34
        console.log(c-d);

        // multiplication operation
        var e = 45
        var f = 3
        console.log(e*f);

        //division operation
        var g = 45
        var h = 3
        console.log(g/h);

        //modulo operation
        var i = 45
        var j = 4
        console.log(i%j);
        
        // equal operator
        var k = 45
        var l = 45
        console.log(k==l)
        console.log(k>l);
        console.log(k<l);
        console.log(k===l);

    </script>
</body>
</html>
